server {
 listen 3000;
 root /usr/share/nginx/html;
 index index.html;
 resolver 127.0.0.11 valid=10s ipv6=off;
 set $backend http://api:8000;
 location /api/ { client_max_body_size 7m; proxy_pass $backend$request_uri; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
 location = /health { proxy_pass $backend$request_uri; }
 location / { try_files $uri $uri.html $uri/ /+not-found.html; }
 location /_expo/ { try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable"; }
}
