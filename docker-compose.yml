services:
  frontend:
    build:
      context: ./frontend
      args:
        API_BASE_URL: http://api:8000
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      api:
        condition: service_healthy

  api:
    image: aspa-backend:local
    build:
      context: ./backend
    command: >-
      sh -c "alembic upgrade head &&
      exec uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      ENVIRONMENT: local
      DATABASE_URL: postgresql+asyncpg://aspa:aspa@postgres:5432/aspa
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-compose-secret-change-before-production}
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  seed:
    image: aspa-backend:local
    command: python -m app.db.seed
    profiles: ["tools"]
    environment:
      ENVIRONMENT: local
      DATABASE_URL: postgresql+asyncpg://aspa:aspa@postgres:5432/aspa
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-compose-secret-change-before-production}
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: aspa
      POSTGRES_USER: aspa
      POSTGRES_PASSWORD: aspa
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aspa -d aspa"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.10.1-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
